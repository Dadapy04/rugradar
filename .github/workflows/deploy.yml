name: Deploy to GitHub Pages

# Live RugRadar ada di branch `gh-pages` (https://dadapy04.github.io/rugradar/).
# Workflow ini membangun `dist/` dari main lalu menerbitkannya ke gh-pages,
# supaya tidak perlu lagi build manual dari laptop.
#
# Rollback: `git push -f origin <sha-lama>:gh-pages` — SHA terakhir sebelum
# deploy otomatis dicatat di FREEMILK-NOTES.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + publish gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Tanpa .nojekyll, GitHub Pages membuang folder berawalan garis bawah.
      - name: Tambah .nojekyll
        run: touch dist/.nojekyll

      - name: Terbitkan dist ke gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} dari main"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
