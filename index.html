<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before React renders, so there is no flash
      // of the wrong theme on load.
      try {
        var rugTheme = localStorage.getItem('rugradar-theme');
        if (rugTheme === 'dark' || rugTheme === 'light') {
          document.documentElement.dataset.theme = rugTheme;
        }
      } catch (e) {}
      // Same for the saved language: the shell now defaults to English, so
      // with Indonesian stored the tab would flash EN until React's title
      // effect runs after mount. Set both here, before first paint. (React
      // itself already reads the stored language synchronously in its state
      // initializer, so page labels never flash; this only fixes the
      // shell-level lang attribute + tab title.)
      // No stored preference → English default.
      try {
        var rugLang = localStorage.getItem('rugradar-lang');
        var rugLangs = ['id', 'en', 'zh', 'es', 'pt', 'ru', 'vi'];
        if (rugLangs.indexOf(rugLang) !== -1) {
          document.documentElement.lang = rugLang;
          if (rugLang === 'id') {
            document.title = 'RugRadar — Pemindai Keamanan Token Solana';
          }
        } else {
          document.documentElement.lang = 'en';
          document.title = 'RugRadar — Solana Token Safety Scanner';
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RugRadar — check a Solana memecoin's safety before you buy. A 0–100 safety score: mint authority, freeze authority, holders, liquidity, and honeypot. Free, no wallet."
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="RugRadar — Solana Token Safety Scanner" />
    <meta
      property="og:description"
      content="Paste a Solana mint address and get a 0–100 safety score in seconds. Free, no wallet."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dadapy04.github.io/rugradar/" />
    <meta property="og:image" content="https://dadapy04.github.io/rugradar/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RugRadar — Solana Token Safety Scanner" />
    <meta
      name="twitter:description"
      content="Paste a Solana mint address and get a 0–100 safety score in seconds. Free, no wallet."
    />
    <title>RugRadar — Solana Token Safety Scanner</title>
  </head>
  <body>
    <noscript>
      <p style="font-family: sans-serif; text-align: center; padding: 2rem;">
        RugRadar needs JavaScript enabled to scan tokens.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
